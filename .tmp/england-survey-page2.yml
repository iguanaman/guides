              - generic [ref=f31e215]:
                - text: I don't think that I can add much to the general discussion about which spirits shine and which struggle against England, so instead I will talk a little about Bringer of Dreams and Nightmares and how he does against England in my experience.
                - text: Since Bringer has made it to both the bottom and top five, clearly people have different experiences with him, personally I rate Bringer as a great spirit against England, but I certainly get the arguments against him and agree that if he gets a "meh" game the team gets a bad game (probably a loss).
                - text: It has been discussed previously on the podcast that Bringer has the potential to become a mediocre defend/utility spirit, and that this might happen more often than him becomming the "wow I just got 20 fear" spirit, so how do we combat becomming a defend Bringer and unlock his full fear potential?
                - text: It's all in the majors... more or less.
                - text: My strategy with Bringer is almost always the same, go top track, get some good majors, sling some fear till the invaders run away. That might not come as a surprise, but what is a good major for Bringer, surely it's a fear generator like [Terrifying Nightmares] or [Paralyzing Fright]. Actually these I consider relatively weak with Bringer as they don't utilise his special rule, and frankly Keeper or even Earth are probably better spirist for those cards. What you want is a major that deals damage or destroys cities, since destroying a city is 5 fear, that is what you are going for, and since England are so good at stacking multible cities, the goal should be to "destroy" more that one per turn in the mid/late game. And unless your entire team is offensive the win condition against England is often a fear victory.
                - text: "Some of the majors that I find best are:"
                - text: "[The land thrashes in furious pain], your board will blight, accept that, and don't forget [Predatory Nightmares] as the elements will trigger [The land thrashes in furious pain]."
                - text: "[The Wounded Wild Turns on its Assailants], the first use will \"destroy\" a city, the second will \"destroy two\", and after the third then any \"deal 1 damage\" card will read \"15 fear\" or more, adding badlands with Bringer is simply nuts, it makes the whole Bringer + Shroud combo seem unneccesary."
                - text: "[Utter a Curse of Dread and Bone], speaking of badlands, if you see this card with Bringer, pick it, play it, repeat. I considder it the best card that Bringer can get, simply add badlands and do \"damage\", and it is so easy to trigger, plus it triggers your right innate."
                - text: All of these cards can and should be played every two out of three turns, another approach is "destroying" your entire board. Which both [Cast down into the Briny Deep] and [Draw Towards a Consuming Void] are great at. Triggering Briny Deep is a struggle, and will probably reley on a teammate playing [Elemental Boon], but it's a game winning plan, triggering Consuming Void is costly but worth it. Both cards require saving some energy and are probably a one or maybe two time thing, but smashing 50-60 fear should put you close to a fear victory.
                - text: "\"What if I don't get any of those?\", well there are plenty of other good majors for Bringer like [Sea Monsters], [Tsunami], [Forests of Living Obsidian], and if you don't hit anything usefull then keep digging!"
                - text: "Now the \"or less\" part: the minors. What is a good minor for Bringer?"
                - text: "Generally the majors will do the heavy lifting, but you need some utility on the side that is affordable. For minors I generally like either:"
                - text: Blight removal, since that can get messy if not handled.
                - text: Simply matching elements can be fine, either for a major you got or your innates.
                - text: Badlands, again adding badlands is just really good with Bringer so look out for those.
                - text: 1 or 2 damage cards, to fuel your badland fear factory.
                - text: "[Sky Stretches to Shore], you are going to get majors, and playing one fast might be the deciding factor, also it helps to trigger Briny Deep."
                - text: That just about sums up my experienses on Bringer and England, on a side note England is my favorite adversary, and the matchup against Ocean + Bringer is always a blast.
                - text: As always, love the podcast, and keep up the great work!
