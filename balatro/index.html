<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Balatro Strategy Guide</title>
<meta name="description" content="A strategy guide for Balatro — joker synergies, deckbuilding, scoring math, and run planning.">
<style>
  :root{
    /* Balatro felt-table + neon poker palette */
    --felt:#0b1f2a;
    --felt-deep:#061319;
    --panel:#123143;
    --panel-2:#0f2735;
    --ink:#f4ecd8;
    --ink-dim:#a9b7bd;
    --red:#fe4c40;        /* Balatro hearts/diamonds red */
    --red-bright:#ff6b5e;
    --blue:#0093ff;       /* spades/clubs / chips blue */
    --blue-bright:#4fb7ff;
    --gold:#ffd94a;       /* mult / gold accents */
    --green:#3fd07a;
    --line:#1d4256;
    --line-bright:#2c6079;
    --shadow:rgba(0,0,0,.6);
  }
  *{box-sizing:border-box}
  html{font-size:18px}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(130% 90% at 50% -10%, #16455b 0%, var(--felt) 55%, var(--felt-deep) 100%) fixed,
      var(--felt);
    color:var(--ink);
    font-family:"m6x11","Trebuchet MS","Segoe UI",system-ui,sans-serif;
    font-size:18px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    padding:6vh 1.5rem;
  }
  main{width:100%;max-width:960px;margin:0 auto}
  h1{
    color:var(--gold);
    font-size:2.2rem;
    letter-spacing:.01em;
    margin:0 0 1.5rem;
  }
  /* empty shell — content filled after layout approval */
</style>
</head>
<body>
<main>
  <h1>Balatro Strategy Guide</h1>
</main>
</body>
</html>
