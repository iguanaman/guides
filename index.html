<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guides</title>
<meta name="description" content="Single-file HTML reference guides.">
<style>
  /* Lantern palette — light (celadon) is home; dark = abyss teal & brass */
  :root{
    color-scheme:light;
    --void:#eceadf;
    --panel:#f6f4ea;
    --panel-raised:#dfdecb;
    --ink:#2b2a20;
    --ink-dim:#65644f;
    --oxide:#9c4326;
    --oxide-bright:#b0522f;
    --bronze:#8f6212;
    --bronze-bright:#6f4c0e;
    --fjord:#2e5f58;
    --fjord-bright:#356e66;
    --line:#d2ceb8;
    --line-bright:#a9a488;
    --shadow:rgba(60,60,30,.14);
    --glow:radial-gradient(100% 55% at 50% -8%, rgba(255,253,240,.85), transparent 62%);
    --overlay:rgba(50,48,30,.5);
    --f-label:"Trebuchet MS","Segoe UI",Verdana,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      color-scheme:dark;
      --void:#0c181d; --panel:#12262f; --panel-raised:#17313c;
      --ink:#ecdfc5; --ink-dim:#b4ac92;
      --oxide:#b35538; --oxide-bright:#d4714b;
      --bronze:#d99b3c; --bronze-bright:#f0bf6b;
      --fjord:#5a8f86; --fjord-bright:#82b8af;
      --line:#1f3d44; --line-bright:#2e5860;
      --shadow:rgba(0,0,0,.5);
      --glow:radial-gradient(100% 55% at 50% -8%, rgba(30,80,95,.5), transparent 62%);
      --overlay:rgba(4,10,12,.8);
    }
  }
  :root[data-theme="light"]{
    color-scheme:light;
    --void:#eceadf; --panel:#f6f4ea; --panel-raised:#dfdecb;
    --ink:#2b2a20; --ink-dim:#65644f;
    --oxide:#9c4326; --oxide-bright:#b0522f;
    --bronze:#8f6212; --bronze-bright:#6f4c0e;
    --fjord:#2e5f58; --fjord-bright:#356e66;
    --line:#d2ceb8; --line-bright:#a9a488;
    --shadow:rgba(60,60,30,.14);
    --glow:radial-gradient(100% 55% at 50% -8%, rgba(255,253,240,.85), transparent 62%);
    --overlay:rgba(50,48,30,.5);
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --void:#0c181d; --panel:#12262f; --panel-raised:#17313c;
    --ink:#ecdfc5; --ink-dim:#b4ac92;
    --oxide:#b35538; --oxide-bright:#d4714b;
    --bronze:#d99b3c; --bronze-bright:#f0bf6b;
    --fjord:#5a8f86; --fjord-bright:#82b8af;
    --line:#1f3d44; --line-bright:#2e5860;
    --shadow:rgba(0,0,0,.5);
    --glow:radial-gradient(100% 55% at 50% -8%, rgba(30,80,95,.5), transparent 62%);
    --overlay:rgba(4,10,12,.8);
  }
  *{box-sizing:border-box}
  html{font-size:18px}
  body{
    margin:0;
    min-height:100vh;
    background-color:var(--void);
    background-image:var(--glow);
    background-attachment:fixed;
    background-repeat:no-repeat;
    color:var(--ink);
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
    font-size:18px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:6vh 1.5rem;
  }
  ::selection{background:var(--bronze);color:var(--void)}
  :focus-visible{outline:2px solid var(--fjord-bright);outline-offset:2px}
  main{width:100%;max-width:940px;margin:auto}

  .theme-toggle{
    position:fixed;
    top:1.4rem;
    right:1.4rem;
    width:38px;
    height:38px;
    border-radius:50%;
    border:1px solid var(--line-bright);
    background:var(--panel);
    color:var(--bronze);
    cursor:pointer;
    font-size:1rem;
    line-height:1;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:transform .15s ease, border-color .15s ease;
  }
  .theme-toggle:hover{transform:rotate(15deg);border-color:var(--bronze)}
  .theme-toggle::before{content:"☾"}
  @media (prefers-color-scheme: dark){ .theme-toggle::before{content:"☀︎"} }
  :root[data-theme="dark"] .theme-toggle::before{content:"☀︎"}
  :root[data-theme="light"] .theme-toggle::before{content:"☾"}

  /* ---------- card grid ---------- */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:14px;
    justify-content:center;
  }
  .card{
    appearance:none;border:1px solid var(--line);background:var(--panel);
    border-radius:6px;cursor:pointer;padding:0;overflow:hidden;
    display:flex;flex-direction:column;text-align:left;text-decoration:none;
    transition:transform .14s ease,border-color .14s ease,box-shadow .14s ease;
    color:inherit;font:inherit;
    box-shadow:0 2px 8px var(--shadow);
  }
  .card:hover{
    transform:translateY(-3px);
    border-color:var(--bronze);
    box-shadow:0 8px 22px var(--shadow);
  }
  .card:focus-visible{outline:2px solid var(--fjord-bright);outline-offset:2px}
  .card-art{height:88px}
  .card-art svg{display:block;width:100%;height:100%}
  .card-body{padding:14px 16px}
  .card-name{
    font-family:inherit;font-variant:small-caps;font-weight:700;
    font-size:1.05rem;line-height:1.3;color:var(--bronze-bright);letter-spacing:.02em;
  }

  @media (max-width:640px){
    body{padding:4rem 1rem 2rem}
    .theme-toggle{top:1rem;right:1rem;width:34px;height:34px}
  }
  @media (prefers-reduced-motion: reduce){
    .theme-toggle,.card{transition:none}
    .theme-toggle:hover,.card:hover{transform:none}
  }
</style>
</head>

<script>
  (function(){
    const root = document.documentElement;
    const saved = localStorage.getItem('guides-theme');
    if(saved === 'light' || saved === 'dark') root.dataset.theme = saved;
    function currentTheme(){
      return root.dataset.theme ||
        (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    }
    document.getElementById('theme-toggle').addEventListener('click', () => {
      const next = currentTheme() === 'dark' ? 'light' : 'dark';
      root.dataset.theme = next;
      localStorage.setItem('guides-theme', next);
    });
  })();
</script>
