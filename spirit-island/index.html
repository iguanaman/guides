<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spirit Island Reference</title>
<meta name="description" content="A reference guide for Spirit Island — spirits, powers, fear, dahan, and invader mechanics.">
<style>
  :root{
    --canopy:#0e1f15;
    --panel:#16301f;
    --bark:#2a1c13;
    --ink:#eee6d3;
    --ink-dim:#a9b8a3;
    --moss:#6fa16a;
    --moss-bright:#92c98a;
    --fire:#d4622b;
    --water:#3f9ba6;
    --earth:#b08a3e;
    --line:#23402b;
    --line-bright:#365a3e;
    --shadow:rgba(0,0,0,.55);
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(120% 80% at 50% -10%, #1c3a26 0%, var(--canopy) 55%, #081109 100%) fixed,
      var(--canopy);
    color:var(--ink);
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
    font-size:18px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  main{width:100%;max-width:960px;margin:0 auto;padding:6vh 1.5rem}
  h1{
    color:var(--moss-bright);
    font-size:2rem;
    letter-spacing:.02em;
    margin:0 0 1.5rem;
    border-bottom:1px solid var(--line);
    padding-bottom:.75rem;
  }
</style>
</head>
<body>
<main>
  <h1>Spirit Island Reference</h1>
</main>
</body>
</html>
